line-length = 90
target-version = "py312"

[lint]
select = ["E", "F", "I", "UP", "B", "BLE", "RUF", "SIM", "C4"]

[lint.per-file-ignores]
# Settings are read at import time, so the test environment must be set
# before any application module is imported.
"tests/conftest.py" = ["E402"]

# These modules catch broadly on purpose, each to stop a non-critical failure
# from taking down the request that triggered it:
#   files.py        -- a failed ingestion must not fail the upload
#   stubs.py        -- probing the local model runtime must never raise
#   ocr.py          -- Tesseract is an external binary; absence is a
#                      degraded mode, not a crash
#   parser.py       -- one unrenderable page must not lose the document
#   embeddings.py   -- indexing without vectors beats refusing the upload
#   neo4j_client.py -- the graph being down degrades search, never fails it
#   reranker.py     -- a reranker that fails must fall back to the lexical
#                      ordering, never take the search down with it
#   vision.py       -- an undescribed drawing is still an ingested drawing
#   hardware.py     -- a runtime that will not answer means nothing is
#                      reclaimable, which is the conservative answer
#   docker_runner.py-- the sandbox reports failure, it never propagates it:
#                      untrusted code must not be able to raise into the host
#   generators/*    -- invalid model content is a refusal, not a crash
#   planner.py      -- a model returning unparseable JSON is an expected
#                      outcome, handled by regeneration
"app/api/files.py" = ["BLE001"]
"app/integrations/stubs.py" = ["BLE001"]
"app/documents/ocr.py" = ["BLE001"]
"app/documents/parser.py" = ["BLE001"]
"app/knowledge/embeddings.py" = ["BLE001"]
"app/knowledge/neo4j_client.py" = ["BLE001"]
"app/knowledge/reranker.py" = ["BLE001"]
"app/documents/vision.py" = ["BLE001"]
"app/routing/hardware.py" = ["BLE001"]
"app/sandbox/docker_runner.py" = ["BLE001"]
"app/tools/generators/docx.py" = ["BLE001"]
"app/tools/generators/xlsx.py" = ["BLE001"]
"app/tools/generators/pptx.py" = ["BLE001"]
"app/tools/gateway.py" = ["BLE001"]
"app/orchestration/planner.py" = ["BLE001"]
"app/orchestration/executor.py" = ["BLE001"]
"app/artifacts/validator.py" = ["BLE001"]
