services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sih}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in a .env file next to this compose file}
      POSTGRES_DB: ${POSTGRES_DB:-sih}
    # Bound to loopback: the database is reachable from this host only.
    ports:
      - "127.0.0.1:5432:5432"
    networks: [sovereign]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sih}"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    # Part 03's vector index and the P&ID equipment graph. Community edition
    # carries the vector index, so no enterprise licence is needed.
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in a .env file next to this compose file}
      # Sized for a laptop running a model alongside it. Raise both on the
      # lab GPU box, where the corpus is larger and VRAM is not the constraint.
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
      # Nothing in this system phones home, and the usage report is an
      # outbound call. Off, or the sovereignty claim is not true.
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      # 7687 is Bolt (the driver). 7474 is the browser UI, published on
      # loopback for local inspection only.
      - "127.0.0.1:7687:7687"
      - "127.0.0.1:7474:7474"
    networks: [sovereign]
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  minio:
    # Object storage for uploads and generated artifacts. On the internal
    # network with everything else that holds document content: it has no
    # route off the host, which is the point.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in a .env file next to this compose file}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in a .env file next to this compose file}
      # No call home, for the same reason Neo4j's usage report is off.
      MINIO_UPDATE: "off"
    # Deliberately no published ports. A container on an internal network
    # cannot publish any -- publishing needs the external connectivity the
    # internal network exists to remove -- so the S3 API and the console are
    # reachable only from inside the compose network, which is exactly the
    # guarantee wanted for the service holding document content.
    #
    # The consequence, stated because it will otherwise surprise someone: an
    # api process running on the host rather than in compose cannot reach
    # this MinIO, and should keep STORAGE_BACKEND=filesystem.
    networks: [sovereign]
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sih}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sih}
      STORAGE_ROOT: /data/storage
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in a .env file next to this compose file}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      # The model runtime stays on the host: it needs the GPU, and passing a
      # card into a container is a deployment concern, not an MVP one.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    # Two networks on purpose. Everything this service needs -- Postgres,
    # Neo4j -- is on the internal one, which Docker gives no default route, so
    # those containers cannot reach the internet even if something in them
    # tried. The api also sits on a second network solely to reach the model
    # runtime on the host; constraining *that* is the host firewall's job,
    # and the in-process egress monitor is what proves nothing used it.
    networks: [sovereign, runtime]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - storage_data:/data/storage

# Nothing here is exposed beyond the host: every published port is bound to
# loopback, and the services that hold document content have no route off the
# machine at all.

networks:
  # internal: true removes the default route. A container on this network has
  # no path off the host at all -- not a firewall rule that could be relaxed,
  # an absent route. Part 05 section 6 asks for default-deny outbound on the
  # network the AI services run in; this is that.
  sovereign:
    internal: true
  # The api's path to the model runtime on the host, and nothing else on it.
  runtime:
    driver: bridge

volumes:
  minio_data:
  postgres_data:
  storage_data:
  neo4j_data:
